name: doclink
description: "Doctor-first telemedicine and digital practice management platform for India."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5

  # Navigation
  go_router: ^14.6.2

  # Network
  dio: ^5.7.0


  # Supabase
  supabase_flutter: ^2.8.4

  # Firebase
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  firebase_analytics: ^11.4.5

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1

  # Charts
  fl_chart: ^0.69.2

  # QR
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # PDF
  pdf: ^3.11.1
  printing: ^5.13.2

  # Sharing
  share_plus: ^10.1.3
  url_launcher: ^6.3.1

  # Media
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  permission_handler: ^11.3.1

  # Utils
  equatable: ^2.0.7
  dartz: ^0.10.1
  intl: ^0.19.0
  uuid: ^4.5.1
  connectivity_plus: ^6.1.1
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - .env
